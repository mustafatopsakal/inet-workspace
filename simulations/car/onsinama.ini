# onsinama.ini -- on sinama kosumlari (UDP seli, yer x PCP)
# Gorev: Dersler/Tasarim Bitirme/danisma/onsinama-gorev.md (2026-09-27)
# omnetpp.ini DEGISTIRILMEDI; burada yalniz ek ayar ve bes config var.
#
# Kosum (car/ dizininden):
#   inet-workspace.exe -u Cmdenv -c <Config> -n <NED> onsinama.ini

include omnetpp.ini

###########################################################
# Ortak taban: kayit ayarlari + saldiri akisinin tanimlari.
# Saldirgan uygulamasi YOK; Onsinama0 bunu dogrudan kullanir.
###########################################################
[Config Onsinama_Ortak]
abstract = true
result-dir = results/onsinama
cmdenv-status-frequency = 5s

# Not: omnetpp.ini'deki *.collectStatistics / **.collectStatistics INET 4.5.4'te
# hicbir modulun parametresi degil (NED'de yok); istatistikler zaten kaydediliyor.
# Burada yalniz vektor hacmi sinirlaniyor: sayaclar (scalar) tam kalir,
# vektor olarak yalniz akis basina gonderim ve alim/gecikme tutulur.
# SIRA ONEMLI: ozel "= true" satirlari genel "= false"tan ONCE.
**.app[*].io.packetSent:vector(packetBytes).vector-recording = true
**.app[*].io.packetReceived:vector(packetBytes).vector-recording = true
**.app[*].sink.meanBitLifeTimePerPacket:vector.vector-recording = true
**.vector-recording = false

# Saldiri paketlerini hedefte karsilayan dinleyiciler (port 2000).
# Dinleyici olmasa hedef UDP katmani her pakete ICMP "port erisilemez"
# uretirdi; bu ek trafik olcumu kirletmesin diye dinleyici var.
*.DaCam.numApps = 15
*.DaCam.app[14].typename = "UdpSinkApp"
*.DaCam.app[14].display-name = "Saldiri Dinleyici"
*.DaCam.app[14].io.localPort = 2000
*.CdAudioDVD.numApps = 3
*.CdAudioDVD.app[2].typename = "UdpSinkApp"
*.CdAudioDVD.app[2].display-name = "Saldiri Dinleyici"
*.CdAudioDVD.app[2].io.localPort = 2000

# Anahtarlar: omnetpp.ini'deki listelerin AYNISI + iki saldiri akisi.
# Saldiri cercevesi RSE'den PCP 0 ya da 5 ile etiketli gelir; anahtar onu
# ayni PCP ile yeniden etiketler. Bu eslemeler olmasa anahtar tanimadigi
# cerceveyi etiketsiz iletir ve SW1'de PCP'si kaybolurdu (bkz. rapor).
*.SW*.bridging.streamCoder.decoder.mapping = [{source: "DaCam", pcp: 5, stream: "S1 Talker"},
												{source: "DaCam", pcp: 5, stream: "S2 Talker"},
												{source: "DaCam", pcp: 5, stream: "S3 Talker"},
												{source: "DaCam", pcp: 5, stream: "S4 Talker"},
												{source: "DaCam", pcp: 5, stream: "S27 Talker"},
												{source: "HU", pcp: 5, stream: "S5 Talker"},
												{source: "HU", pcp: 5, stream: "S6 Talker"},
												{source: "HU", pcp: 5, stream: "S7 Talker"},
												{source: "HU", pcp: 5, stream: "S8 Talker"},
												{source: "HU", pcp: 5, stream: "S9 Talker"},
												{source: "HU", pcp: 5, stream: "S10 Talker"},
												{source: "HU", pcp: 5, stream: "S11 Talker"},
												{source: "HU", pcp: 5, stream: "S12 Talker"},
												{source: "HU", pcp: 5, stream: "S13 Talker"},
												{source: "HU", pcp: 5, stream: "S14 Talker"},
												{source: "HU", pcp: 5, stream: "S15 Talker"},
												{source: "CU", pcp: 5, stream: "S16 Talker"},
												{source: "CU", pcp: 5, stream: "S17 Talker"},
												{source: "CU", pcp: 5, stream: "S18 Talker"},
												{source: "CU", pcp: 5, stream: "S19 Talker"},
												{source: "CU", pcp: 5, stream: "S20 Talker"},
												{source: "CU", pcp: 5, stream: "S21 Talker"},
												{source: "CU", pcp: 5, stream: "S22 Talker"},
												{source: "Cam1", pcp: 5, stream: "S23 Talker"},
												{source: "Cam2", pcp: 5, stream: "S24 Talker"},
												{source: "Cam3", pcp: 5, stream: "S25 Talker"},
												{source: "Cam4", pcp: 5, stream: "S26 Talker"},
												{source: "Telematics", pcp: 5, stream: "S28 Talker"},
												{source: "Telematics", pcp: 4, stream: "S29 Talker"},
												{source: "CdAudioDVD", pcp: 4, stream: "S30 Talker"},
												{source: "CdAudioDVD", pcp: 4, stream: "S31 Talker"},
												{source: "RSE", pcp: 0, stream: "SA0 Saldirgan"},
												{source: "RSE", pcp: 5, stream: "SA5 Saldirgan"}]

*.SW*.bridging.streamCoder.encoder.mapping = [{stream: "S1 Talker", pcp: 5},
