###########################################################
# Saldirgan: RSE uzerinde UDP seli. Hiz ve pencere bes kosumda ayni.
# 1400 B yuk, 12 us aralik; ilk paket t=5 s, son paket t<10 s.
###########################################################
[Config Onsinama_Saldiri]
abstract = true
extends = Onsinama_Ortak
*.RSE.numApps = 4
*.RSE.app[3].typename = "UdpSourceApp"
*.RSE.app[3].display-name = "Saldirgan"
*.RSE.app[3].source.packetNameFormat = "%M->saldiri-%c"
*.RSE.app[3].source.packetLength = 1400B
*.RSE.app[3].source.initialProductionOffset = 5s
*.RSE.app[3].source.productionInterval = (simTime() + 12us < 10s) ? 12us : 1000s
*.RSE.app[3].io.destPort = 2000

[Config Onsinama_Saldiri_PCP0]
abstract = true
extends = Onsinama_Saldiri
*.RSE.bridging.streamIdentifier.identifier.mapping = [{stream: "SA0 Saldirgan", packetFilter: expr(udp.destPort == 2000)}]
*.RSE.bridging.streamCoder.encoder.mapping = [{stream: "SA0 Saldirgan", pcp: 0}]

[Config Onsinama_Saldiri_PCP5]
abstract = true
extends = Onsinama_Saldiri
*.RSE.bridging.streamIdentifier.identifier.mapping = [{stream: "SA5 Saldirgan", packetFilter: expr(udp.destPort == 2000)}]
*.RSE.bridging.streamCoder.encoder.mapping = [{stream: "SA5 Saldirgan", pcp: 5}]

###########################################################
# Bes kosum
###########################################################
[Config Onsinama0_Saldirisiz]
extends = Onsinama_Ortak

[Config Onsinama1_Yolda_EnIyiCaba]
extends = Onsinama_Saldiri_PCP0
*.RSE.app[3].io.destAddress = "DaCam"

[Config Onsinama2_Yolda_SinifA]
extends = Onsinama_Saldiri_PCP5
*.RSE.app[3].io.destAddress = "DaCam"

[Config Onsinama3_YolDisi_EnIyiCaba]
extends = Onsinama_Saldiri_PCP0
*.RSE.app[3].io.destAddress = "CdAudioDVD"

[Config Onsinama4_YolDisi_SinifA]
extends = Onsinama_Saldiri_PCP5
*.RSE.app[3].io.destAddress = "CdAudioDVD"
